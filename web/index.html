<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOKO — Japan Risk Map</title>
  <meta name="description" content="Click any place in Japan to see its flood, storm surge, landslide and earthquake risk, from official open data. 日本中どこでも、住所から災害リスクを確認。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">ここ</span>
      <div>
        <h1>KOKO</h1>
        <p data-i18n="brand.tagline">Disaster risk for any address in Japan</p>
      </div>
    </div>
    <form id="search" class="search" role="search">
      <input id="q" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria"
             placeholder="Address in Japanese, e.g. 江戸川区船堀, or lat,lon" aria-label="Search an address" autocomplete="off">
      <button type="submit" data-i18n="search.button">Search</button>
    </form>
    <div class="lang-switch" role="group" data-i18n-aria="lang.switch" aria-label="Language">
      <button type="button" data-lang="ja" lang="ja">日本語</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-report" aria-selected="true" aria-controls="panel" data-i18n="tab.report">Report</button>
        <button role="tab" id="tab-chat" aria-selected="false" aria-controls="chat">✨ <span data-i18n="tab.chat">Ask KOKO</span> <span class="badge">AI</span></button>
      </div>
      <section id="chat" class="chat" hidden>
        <div id="chat-log" class="chat-log" aria-live="polite">
          <div class="chat-welcome">
            <p data-i18n="chat.welcome"></p>
            <div class="suggest">
              <button data-i18n="chat.s1" data-i18n-q="chat.s1q"></button>
              <button data-i18n="chat.s2" data-i18n-q="chat.s2q"></button>
              <button data-i18n="chat.s3" data-i18n-q="chat.s3q"></button>
              <button data-i18n="chat.s4" data-i18n-q="chat.s4q"></button>
            </div>
          </div>
        </div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" rows="2" data-i18n-placeholder="chat.placeholder" data-i18n-aria="chat.aria"></textarea>
          <button type="submit" id="chat-send" data-i18n="chat.send">Send</button>
        </form>
        <p class="chat-note" data-i18n="chat.note"></p>
      </section>
      <div id="panel" class="report" aria-live="polite">
        <section class="intro">
          <h2 data-i18n="intro.title">Click anywhere on the map</h2>
          <p data-i18n="intro.body"></p>
          <ul class="steps">
            <li data-i18n="intro.flood"></li>
            <li data-i18n="intro.building"></li>
            <li data-i18n="intro.zones"></li>
            <li data-i18n="intro.quake"></li>
            <li data-i18n="intro.shelters"></li>
          </ul>
          <p class="hint"><span data-i18n="intro.try">Try:</span>
            <a href="#" data-goto="35.6835,139.8642" data-i18n="intro.ex.edogawa"></a> ·
            <a href="#" data-goto="35.6950,139.7745" data-i18n="intro.ex.kanda"></a> ·
            <a href="#" data-goto="34.6825,135.4660" data-i18n="intro.ex.nishikujo"></a> ·
            <a href="#" data-goto="34.7025,135.4959" data-i18n="intro.ex.umeda"></a></p>
          <p class="hint" data-i18n="intro.plateau"></p>
        </section>
      </div>
    </aside>
    <div id="map" class="map" aria-label="Map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="chat.js"></script>
</body>
</html>
