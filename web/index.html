<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOKO — Japan Risk Map</title>
  <meta name="description" content="Explore flood, storm surge, landslide and earthquake risk for any prefecture and municipality in Japan, from official open data. 日本中の都道府県・市区町村の災害リスクを確認。">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">ここ</span>
      <div>
        <h1>KOKO</h1>
        <p data-i18n="brand.tagline">Disaster risk for any address in Japan</p>
      </div>
    </div>
    <form id="search" class="search" role="search">
      <input id="q" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria"
             placeholder="Address in Japanese, e.g. 江戸川区船堀, or lat,lon" aria-label="Search an address" autocomplete="off">
      <button type="submit" data-i18n="search.button">Search</button>
    </form>
    <div class="lang-switch" role="group" data-i18n-aria="lang.switch" aria-label="Language">
      <button type="button" data-lang="ja" lang="ja">日本語</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-report" aria-selected="true" aria-controls="panel" data-i18n="tab.area">Area</button>
        <button role="tab" id="tab-chat" aria-selected="false" aria-controls="chat">✨ <span data-i18n="tab.chat">Ask KOKO</span> <span class="badge">AI</span></button>
      </div>
      <section id="chat" class="chat" hidden>
        <div id="chat-log" class="chat-log" aria-live="polite">
          <div class="chat-welcome">
            <p data-i18n="chat.welcome"></p>
            <div class="suggest">
              <button data-i18n="chat.s1" data-i18n-q="chat.s1q"></button>
              <button data-i18n="chat.s2" data-i18n-q="chat.s2q"></button>
              <button data-i18n="chat.s3" data-i18n-q="chat.s3q"></button>
              <button data-i18n="chat.s4" data-i18n-q="chat.s4q"></button>
            </div>
          </div>
        </div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" rows="2" data-i18n-placeholder="chat.placeholder" data-i18n-aria="chat.aria"></textarea>
          <button type="submit" id="chat-send" data-i18n="chat.send">Send</button>
        </form>
        <p class="chat-note" data-i18n="chat.note"></p>
      </section>
      <div id="panel" class="report">
        <nav class="picker" aria-label="Area">
          <ol class="crumbs" id="crumbs"></ol>
          <label><span data-i18n="nav.prefLabel">Prefecture</span>
            <select id="pref-select"></select></label>
          <label><span data-i18n="nav.muniLabel">Municipality</span>
            <select id="muni-select" disabled></select></label>
        </nav>
        <div id="area-body" aria-live="polite"></div>
      </div>
    </aside>
    <div class="mapwrap">
      <div id="map" class="map" aria-label="Map"></div>
      <div id="hover-tip" class="hover-tip" hidden></div>
      <button type="button" id="view-toggle" class="view-toggle" aria-pressed="false">3D</button>
      <div id="layer-panel" class="layer-panel" hidden></div>
      <div id="legend" class="legend legend-map" hidden></div>
    </div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
          integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin=""></script>
  <script src="i18n.js?v=7"></script>
  <script src="report_view.js?v=7"></script>
  <script src="app.js?v=7"></script>
  <script src="chat.js?v=7"></script>
</body>
</html>
