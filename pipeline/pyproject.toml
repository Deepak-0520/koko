[project]
name = "koko-pipeline"
version = "0.1.0"
description = "KOKO data pipeline: Japanese open hazard data and PLATEAU buildings into PostGIS"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "pyarrow>=15",
    "shapely>=2.0",
    "requests>=2.31",
    "lxml>=5",
    "remotezip>=0.12",
    "psycopg[binary]>=3.2",
]

[project.scripts]
koko-pipeline = "koko_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["koko_pipeline*"]
